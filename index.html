<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="GNOLAND. Os casos do nosso universo de Ordem Paranormal.">
  <title>GNOLAND | Ordem Paranormal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#casos">Ir para os casos</a>
  <div class="site-wrap" id="inicio">
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="GNOLAND, início">
        <img src="assets/gnomo.svg" alt="" width="34" height="54">
        <span>GNOLAND</span>
      </a>
      <nav aria-label="Navegação principal">
        <a href="#casos">Os casos</a>
      </nav>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-heading">
        <div class="hero-copy">
          <div class="eyebrow"><span class="eyebrow-ornament" aria-hidden="true">✦</span> NOSSAS MESAS DE ORDEM PARANORMAL</div>
          <h1 id="hero-heading">GNOLAND<span class="title-period">.</span></h1>
          <p>Um lugar para revisitar os casos que vivemos juntos.</p>
          <a class="explore-button" href="#casos">Explorar os casos <span aria-hidden="true">↓</span></a>
        </div>
        <div class="hero-illustration" aria-hidden="true">
          <span class="illustration-ornament illustration-ornament-top">✣</span>
          <img src="assets/gnomo.svg" alt="" width="468" height="745">
          <span class="illustration-ornament illustration-ornament-bottom">✣</span>
        </div>
      </section>

      <section class="cases" id="casos" aria-labelledby="cases-heading">
        <div class="section-heading">
          <span class="section-symbol" aria-hidden="true">✦</span>
          <h2 id="cases-heading">Os casos</h2>
          <span class="section-count">03</span>
        </div>
        <div class="case-grid">
          <button class="case-card case-heredistho" data-case="heredistho" type="button" aria-label="Abrir A Maldição de Heredistho">
            <span class="case-card-number">01</span>
            <span class="case-symbol"><img src="assets/simbolo-heredistho.svg" alt="" width="303" height="320" loading="lazy"></span>
            <span class="case-details">
              <span class="case-status">Já jogado</span>
              <span class="case-title">A Maldição de<br>Heredistho</span>
              <span class="case-action">Abrir caso <span aria-hidden="true">↗</span></span>
            </span>
          </button>
          <button class="case-card case-principe" data-case="principe" type="button" aria-label="Abrir O Culto do Príncipe">
            <span class="case-card-number">02</span>
            <span class="case-symbol"><img src="assets/simbolo-principe.svg" alt="" width="288" height="290" loading="lazy"></span>
            <span class="case-details">
              <span class="case-status">Já jogado</span>
              <span class="case-title">O Culto do<br>Príncipe</span>
              <span class="case-action">Abrir caso <span aria-hidden="true">↗</span></span>
            </span>
          </button>
          <button class="case-card case-cataclisma" data-case="cataclisma" type="button" aria-label="Abrir O Cataclisma">
            <span class="case-card-number">03</span>
            <span class="case-symbol case-unrevealed"><span aria-hidden="true">?</span></span>
            <span class="case-details">
              <span class="case-status">Ainda não jogado</span>
              <span class="case-title">O Cataclisma</span>
              <span class="case-action">Abrir caso <span aria-hidden="true">↗</span></span>
            </span>
          </button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span class="footer-name">GNOLAND</span>
      <span>Feito para os nossos amigos.</span>
      <a href="#inicio">Voltar ao início ↑</a>
    </footer>
  </div>

  <dialog class="case-dialog" id="case-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content">
      <div class="dialog-top">
        <span id="dialog-index">CASO 01</span>
        <button type="button" class="dialog-close" id="dialog-close" aria-label="Fechar">×</button>
      </div>
      <h2 id="dialog-title">A Maldição de Heredistho</h2>
      <p id="dialog-status">Já jogado</p>
      <div class="dialog-divider"></div>
      <p class="dialog-placeholder">Página em preparação.</p>
      <button type="button" class="dialog-back" id="dialog-back">Voltar aos casos</button>
    </div>
  </dialog>
</body>
</html>
